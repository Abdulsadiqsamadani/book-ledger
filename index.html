<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Ledger</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">
        <section class="book-section">
            <h1>All awesome books</h1>
            <div id="booksContainer" class="book-list"></div>
        </section>
        <hr class="section-divider">
        <section class="form-section">
            <h2>Add a new book</h2>
            <form id="bookForm" class="form-container">
                <input type="text" id="titleInput" placeholder="Title" required>
                <input type="text" id="authorInput" placeholder="Author" required>
                <button type="submit" class="add-btn">Add</button>
            </form>
        </section>
    </div>

    <script  type="module" src="app.js"></script>
</body>
</html>
